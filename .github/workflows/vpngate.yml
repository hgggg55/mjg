name: vpngate-csv2clash

on:
  schedule:
    - cron: '*/25 * * * *'   # 25 分钟一刷, 想省配额改成 '0 */6 * * *'(6小时一次)
  workflow_dispatch:          # 允许手动点按钮跑

jobs:
  fetch-convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch & Convert
        run: |
          pip install pyyaml
          python3 convert.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vpngate*.yaml
          if git diff --cached --quiet; then
            echo "无变化, 跳过提交"
            exit 0
          fi
          git commit -m "auto update $(date -u +'%F %T UTC')"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "push 成功"
              exit 0
            fi
            echo "push 重试 $i ..."
            sleep 3
          done
          exit 1
